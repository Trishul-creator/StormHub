<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Confirm your StormHub account</title>
  </head>
  <body style="margin:0;background:#f5f7fb;color:#172033;font-family:Arial,sans-serif">
    <div style="display:none;max-height:0;overflow:hidden">
      Confirm your email address to finish creating your StormHub account.
    </div>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f7fb;padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #e2e8f0;border-radius:16px">
            <tr>
              <td style="padding:32px">
                <p style="margin:0 0 20px;color:#1d4ed8;font-size:14px;font-weight:700">StormHub</p>
                <h1 style="margin:0 0 12px;font-size:24px;line-height:1.25">Confirm your email address</h1>
                <p style="margin:0 0 24px;color:#475569;font-size:16px;line-height:1.6">
                  Use the button below to finish creating your school workspace account.
                </p>
                <p style="margin:0 0 24px">
                  <a href="{{ .ConfirmationURL }}" style="display:inline-block;border-radius:10px;background:#1d4ed8;color:#ffffff;padding:12px 20px;text-decoration:none;font-weight:700">
                    Confirm email address
                  </a>
                </p>
                <p style="margin:0;color:#64748b;font-size:13px;line-height:1.5">
                  If you did not create a StormHub account, you can safely ignore this message.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>

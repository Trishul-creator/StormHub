name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_DEMO_MODE: "true"
      EMAIL_DELIVERY_MODE: outbox_only
      EMAIL_PROVIDER: disabled
      AI_FEATURES_ENABLED: "false"
      GROQ_ENABLED: "false"
      AI_DATA_SHARING_APPROVED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit and component tests
        run: npm run test

      - name: Read-only E2E
        run: npm run test:e2e:readonly

      - name: Accessibility and keyboard E2E
        run: npx playwright test tests/e2e/accessibility.spec.ts

  database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector

      - name: Rebuild database from migrations
        run: supabase db reset

      - name: Run pgTAP database tests
        run: supabase test db

      - name: Lint database
        run: supabase db lint --local --level error
